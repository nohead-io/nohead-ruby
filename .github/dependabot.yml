# Weekly, grouped dependency updates. The gem has no runtime
# dependencies; these are its development tools and the CI actions.
version: 2

updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # New releases wait a week before a PR (security updates do not), so a
    # compromised or yanked release is usually caught first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      bundler-security:
        applies-to: security-updates
        patterns: ["*"]
      bundler-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      bundler-major:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
