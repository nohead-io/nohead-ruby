name: CI

on:
  push:
    # The API repository pushes contract/update. Its pull request is opened by
    # github-actions (contract-pr.yml), which starts no pull_request run.
    branches: [main, contract/update]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Ruby release (nohead.gemspec "required_ruby_version").
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  checks:
    name: Lint and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop
      # The operation table and the API reference's code samples must match
      # openapi.json and test/calls.rb.
      - run: bundle exec rake generate samples
      - run: git diff --exit-code
      - run: gem build nohead.gemspec

  # The one check main's ruleset requires, so the required checks don't change
  # when the version matrix does.
  ci-success:
    name: CI passed
    if: always()
    needs: [test, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(. == "success")'
