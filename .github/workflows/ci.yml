name: CI

on:
  push:
    # The API repository pushes contract/update, and this push run is its
    # check. Its pull request is opened by github-actions (contract-pr.yml),
    # so GitHub holds that pull request's run for approval: a duplicate.
    branches: [main, contract/update]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every supported Ruby release (nohead.gemspec "required_ruby_version").
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  checks:
    name: Lint and generated code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop
      # The operation table and the API reference's code samples must match
      # openapi.json and test/calls.rb.
      - run: bundle exec rake generate samples
      - run: git diff --exit-code
      - run: gem build nohead.gemspec

  # gitleaks' default rules, and Nohead's own key shapes (.gitleaks.toml),
  # over the whole history. Run as a container: gitleaks-action needs a
  # license for organizations.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secrets in the git history
        run: |
          # gitleaks 8.30.0
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --no-banner --redact --exit-code 1

  # The one check main's ruleset requires, so the required checks don't change
  # when the version matrix does.
  ci-success:
    name: CI passed
    if: always()
    needs: [test, checks, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(. == "success")'
