# Publishes a release when its tag (v1.2.3) is pushed. Tags are pushed by the
# Nohead API repository's "SDK release" workflow, after this commit's smoke
# test passed against the API. RubyGems trusted publishing (OIDC, no API key)
# pushes the gem; the GitHub release carries the same gem, and
# CHANGELOG.md's section for the version is its notes. (RubyGems signs a
# push itself only from 4.1; Ruby 4.0 has 4.0.)
#
# Two jobs, so no dependency code runs where the publishing credential can be
# minted: `build` packs the gem without it (it needs no dependencies; CI and
# the smoke test have already tested this commit), and `publish` only pushes
# that gem.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only a commit on main is released, whoever pushed the tag: the deploy
      # key that pushes tags also syncs the contract.
      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        # Compared with main's commit, not the name, which a tag could shadow.
        run: |
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "repos/$REPO/compare/$main...$SHA" --jq .status)
          case "$status" in
            identical | behind) ;;
            *) echo "::error::$TAG ($SHA) is not on main ($status)"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: false
      - name: Check the version and its notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(ruby -r ./lib/nohead/version -e 'print Nohead::VERSION')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match lib/nohead/version.rb $version"; exit 1
          fi
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
      - run: |
          mkdir release
          gem build nohead.gemspec --output "release/nohead-${GITHUB_REF_NAME#v}.gem"
          mv notes.md release/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: release
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # RubyGems' trusted publisher only accepts this environment, which only v* tags can use.
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: false
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push ./*.gem
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" -R "$REPO" --verify-tag --title "$TAG" --notes-file notes.md ./*.gem
